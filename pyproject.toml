[project]
name = "dbs-operations-intelligence"
version = "0.1.0"
description = "AI-powered Operations Intelligence Agent for enterprise analytics."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "mcp>=2.2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]